apiVersion: batch/v1
kind: Job
metadata:
  name: seed
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: seed
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: mini-ecommerce-migrate:latest
          imagePullPolicy: IfNotPresent
          command:
            - npm
            - run
            - db:seed
            - -w
            - backend
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DATABASE_URL
            - name: NODE_ENV
              value: "production"
