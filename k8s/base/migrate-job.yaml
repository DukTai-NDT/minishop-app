apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: mini-ecommerce-migrate:latest
          imagePullPolicy: IfNotPresent
          command:
            - npm
            - run
            - db:deploy
            - -w
            - backend
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DATABASE_URL
            - name: NODE_ENV
              value: "production"
