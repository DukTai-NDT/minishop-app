name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-only values. CI does not connect to a database.
      DATABASE_URL: postgresql://minishop:build-only@localhost:5432/minishop?schema=public
      NEXT_PUBLIC_API_URL: http://localhost:4000/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w backend

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run backend tests
        run: npm test

      - name: Build applications
        run: npm run build

  docker-build:
    name: Build and verify Docker images
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag minishop-backend:ci .

      - name: Build frontend image
        run: >-
          docker build --file frontend/Dockerfile --tag minishop-frontend:ci
          --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000/api .

      - name: Verify built images
        run: docker image inspect minishop-backend:ci minishop-frontend:ci

  publish:
    name: Publish Docker images to GHCR
    needs: [validate, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/docker-setup'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/duktai-ndt/minishop-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/DukTai-NDT/minishop-app
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push Frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/duktai-ndt/minishop-frontend:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:4000/api
          labels: |
            org.opencontainers.image.source=https://github.com/DukTai-NDT/minishop-app
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  update-manifests:
    name: Update GitOps image tags
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/docker-setup'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4
        with:
          ref: feature/docker-setup
          fetch-depth: 0
          persist-credentials: true

      - name: Check branch has not advanced
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [ "$CURRENT_SHA" != "$BUILD_SHA" ]; then
            echo "::error::Branch advanced since image build. Refusing to deploy an older image."
            exit 1
          fi

      - name: Update Kustomize image tags
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("k8s/base/kustomization.yaml")
          content = path.read_text()
          tag = "sha-" + os.environ["BUILD_SHA"]

          for image in ("mini-ecommerce-backend", "mini-ecommerce-frontend"):
              lines = content.splitlines(keepends=True)
              found = False

              for i, line in enumerate(lines):
                  if line.strip() == f"- name: {image}":
                      if found:
                          raise SystemExit(f"Duplicate image: {image}")
                      found = True
                      for j in range(i + 1, len(lines)):
                          if lines[j].strip().startswith("- name:"):
                              break
                          if lines[j].strip().startswith("newTag:"):
                              indent = lines[j][:len(lines[j]) - len(lines[j].lstrip())]
                              lines[j] = f"{indent}newTag: {tag}\n"
                              break
                      else:
                          j = len(lines)
                      if not any(
                          x.strip() == f"newTag: {tag}"
                          for x in lines[i + 1:j]
                      ):
                          raise SystemExit(f"Missing newTag for {image}")

              if not found:
                  raise SystemExit(f"Image not found: {image}")
              content = "".join(lines)

          path.write_text(content)
          print(f"Updated backend and frontend to {tag}")
          PY

      - name: Commit and push GitOps update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/base/kustomization.yaml

          if git diff --cached --quiet; then
            echo "Image tags already up to date."
            exit 0
          fi

          git commit -m "gitops: update images to sha-${GITHUB_SHA}"
          git push origin HEAD:feature/docker-setup
