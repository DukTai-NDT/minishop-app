apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minishop
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/DukTai-NDT/minishop-app.git
    targetRevision: main
    path: k8s/base

  destination:
    server: https://kubernetes.default.svc
    namespace: minishop

  syncPolicy:
    automated:
        prune: false
        selfHeal: true
    syncOptions:
      - CreateNamespace=true