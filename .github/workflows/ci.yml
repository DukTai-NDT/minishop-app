name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-only values. CI does not connect to a database.
      DATABASE_URL: postgresql://minishop:build-only@localhost:5432/minishop?schema=public
      NEXT_PUBLIC_API_URL: http://localhost:4000/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w backend

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run backend tests
        run: npm test

      - name: Build applications
        run: npm run build

  docker-build:
    name: Build and verify Docker images
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag minishop-backend:ci .

      - name: Build frontend image
        run: >-
          docker build --file frontend/Dockerfile --tag minishop-frontend:ci
          --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000/api .

      - name: Verify built images
        run: docker image inspect minishop-backend:ci minishop-frontend:ci

  publish:
    name: Authenticate to GitHub Container Registry
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
